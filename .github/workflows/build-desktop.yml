name: Build Desktop App (Electron)

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-renderer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    name: Build renderer

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck i-Buk
        run: pnpm --filter @workspace/i-buk run typecheck

      - name: Test local domain logic
        run: pnpm --filter @workspace/i-buk run test

      - name: Check config formatting
        run: |
          pnpm exec prettier --check package.json
          node -e "JSON.parse(require('node:fs').readFileSync('desktop/package.json', 'utf8'))"

      - name: Check desktop JavaScript syntax
        run: |
          node --check desktop/main.cjs
          node --check desktop/preload.cjs
          node --check desktop/path-utils.cjs
          node --check desktop/workspace-store.cjs
          node --test desktop/path-utils.test.cjs desktop/workspace-store.test.cjs

      - name: Build i-Buk renderer
        env:
          BASE_PATH: "./"
          PORT: "21211"
          NODE_ENV: "production"
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: pnpm --filter @workspace/i-buk run build

      - name: Upload renderer
        uses: actions/upload-artifact@v4
        with:
          name: i-Buk-renderer
          path: artifacts/i-buk/dist/public
          if-no-files-found: error
          retention-days: 1

  build-installer:
    needs: build-renderer
    runs-on: windows-latest
    timeout-minutes: 30
    name: Windows 11 x64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Download renderer
        uses: actions/download-artifact@v4
        with:
          name: i-Buk-renderer
          path: artifacts/i-buk/dist/public

      - name: Verify renderer
        shell: pwsh
        run: |
          if (-not (Test-Path "artifacts/i-buk/dist/public/index.html")) {
            throw "The renderer artifact did not contain index.html."
          }

      - name: Install Electron dependencies
        working-directory: desktop
        shell: pwsh
        run: |
          $lockPath = Join-Path $PWD "package-lock.json"
          $lock = Get-Content -Raw $lockPath
          $lock = $lock.Replace(
            "http://package-firewall.replit.local/npm/",
            "https://registry.npmjs.org/"
          )
          Set-Content -Path $lockPath -Value $lock -NoNewline
          if ($lock.Contains("package-firewall.replit.local")) {
            throw "The Electron lockfile still contains an internal package registry URL."
          }
          npm ci --registry=https://registry.npmjs.org

      - name: Build Windows installer
        working-directory: desktop
        run: npm run dist:win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: i-Buk-Windows-Installer
          path: |
            desktop/dist/**/*.exe
            !desktop/dist/win-unpacked/**
          if-no-files-found: error
          retention-days: 30
