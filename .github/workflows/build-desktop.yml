name: Build Desktop App (Electron)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    name: Windows 11 x64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build API server
        run: pnpm --filter @workspace/api-server run build

      - name: Build React frontend
        env:
          BASE_PATH: "./"
          PORT: "21211"
          NODE_ENV: "production"
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: pnpm --filter @workspace/i-buk run build

      - name: Install Electron dependencies
        working-directory: desktop
        run: |
          node -e "const fs = require('fs'); const file = 'package-lock.json'; const lock = fs.readFileSync(file, 'utf8'); fs.writeFileSync(file, lock.replaceAll('http://package-firewall.replit.local/npm/', 'https://registry.npmjs.org/'));"
          npm ci --registry=https://registry.npmjs.org

      - name: Build Windows installer
        working-directory: desktop
        run: npm run dist:win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: i-Buk-Windows-Installer
          path: |
            desktop/dist/**/*.exe
            !desktop/dist/win-unpacked/**
          if-no-files-found: error
          retention-days: 30