name: i-Buk checks

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck i-Buk
        run: pnpm --filter @workspace/i-buk run typecheck
      - name: Test local domain logic
        run: pnpm --filter @workspace/i-buk run test
      - name: Build i-Buk preview
        run: PORT=4173 BASE_PATH=/ pnpm --filter @workspace/i-buk run build