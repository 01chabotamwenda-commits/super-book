openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: gemini
    description: Study-planning assistance powered by Gemini
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /gemini/explain:
    post:
      operationId: explainGeminiSchedule
      tags: [gemini]
      summary: Explain deterministic study suggestions
      description: Returns a concise explanation of structured i-Buk study recommendations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeminiExplanationInput"
      responses:
        "200":
          description: Schedule explanation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GeminiExplanation"
        "400":
          description: Invalid request
        "502":
          description: Gemini is unavailable or returned invalid output
        "503":
          description: Gemini is not configured
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    GeminiRecommendation:
      type: object
      properties:
        topic:
          type: string
          minLength: 1
        course:
          type: string
          minLength: 1
        minutes:
          type: number
          format: float
          minimum: 1
        reason:
          type: string
          minLength: 1
      required:
        - topic
        - course
        - minutes
        - reason
    GeminiExam:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        course:
          type: string
          minLength: 1
        timing:
          type: string
          minLength: 1
      required:
        - title
        - course
        - timing
    GeminiExplanationInput:
      type: object
      properties:
        recommendations:
          type: array
          maxItems: 7
          items:
            $ref: "#/components/schemas/GeminiRecommendation"
        upcomingExams:
          type: array
          maxItems: 7
          items:
            $ref: "#/components/schemas/GeminiExam"
        availability:
          type: string
          minLength: 1
          maxLength: 240
      required:
        - recommendations
        - upcomingExams
        - availability
    GeminiExplanation:
      type: object
      properties:
        explanation:
          type: string
          minLength: 1
          maxLength: 2000
      required:
        - explanation

